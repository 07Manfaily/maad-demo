name: Déployer les démos sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backoffice/package-lock.json
            mobile/package-lock.json
      # Back-office (React + Vite) à la racine du site
      - run: npm ci
        working-directory: backoffice
      - run: npm run build
        working-directory: backoffice
      # Appli adhérents (Expo / React Native Web) dans /mobile
      - run: npm ci
        working-directory: mobile
      - run: npx expo export --platform web --output-dir dist
        working-directory: mobile
      - run: cp -r mobile/dist backoffice/dist/mobile
      - uses: actions/upload-pages-artifact@v3
        with:
          path: backoffice/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
